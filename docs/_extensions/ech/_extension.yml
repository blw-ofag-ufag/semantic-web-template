title: eCH standard
author: Federal Office for Agriculture FOAG
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  shortcodes:
    - ech_shortcodes.lua
  formats:
    # Shared by all formats. Before Quarto's own filters run, plantuml.lua
    # turns PlantUML code blocks into figures, sparql.lua turns SPARQL queries
    # into tables and ech_metadata.lua translates
    # the eCH metadata (see project.yml); the other two filters rework
    # captions and citations afterwards.
    common:
      filters:
        - plantuml.lua
        - sparql.lua
        - ech_metadata.lua
        - quarto
        - ech_captions.lua
        - ech_citations.lua
      shortcodes:
        - ech_shortcodes.lua
      csl: din_1505_2_alphanumeric.csl
      toc: true
      toc-depth: 2
      number-sections: true
    html:
      theme:
        light: [cosmo, ech.scss]
        dark: [cosmo, ech.scss, ech_dark.scss]
      template-partials:
        - title-metadata.html
      highlight-style: github   # muted colours in both the light and the dark theme
      code-line-numbers: true
      tbl-colwidths: true       # keep the column widths of the generated grid tables
      reference-location: margin   # footnotes in the right margin, beside the text
      syntax-definitions:
        - sparql.xml
        - turtle.xml
    typst:
      papersize: a4
      mainfont: Nimbus Sans
      fontsize: 11pt
      toc-depth: 3
      section-numbering: 1.1.1
      template-partials:
        - typst-template.typ
        - typst-show.typ
      code-line-numbers: true
      syntax-definitions:
        - sparql.xml
        - turtle.xml
      citeproc: true
      link-citations: true
    gfm: default
    docx:
      reference-doc: https://ech.ch/sites/default/files/imce/eCH-Dossier/0001-0030/eCH-0003/11.1.0/Beilagen/Beilagen%20aktuell%2028.11.2025/XXXX_d_DRA_JJJJ-MM-TT_eCH-0XXX_Vx.x.x_Titel.docx
      link-citations: true

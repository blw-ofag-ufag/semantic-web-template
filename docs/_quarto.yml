project:
  output-dir: ../build/docs/
  type: website
  render:
    - de/index.qmd
    - fr/index.qmd
    - en/index.qmd

website:
  title: eCH-1234 Version 2.4.1 (Working Draft)
  repo-url: https://github.com/blw-ofag-ufag/semantic-web-template
  favicon: assets/favicon.svg
  navbar:
    background: dark
    title: false
    logo: assets/ech.svg
    logo-alt: eCH
    right:
      - icon: github
        href: https://github.com/blw-ofag-ufag/semantic-web-template
        aria-label: GitHub
      - icon: bug
        href: https://github.com/blw-ofag-ufag/semantic-web-template/issues/new
        aria-label: Issue
      - icon: envelope
        href: mailto:agridata.ch@blw.admin.ch
        aria-label: Contact
      - icon: translate
        menu:
          - text: English
            href: /en/index.html
          - text: Deutsch
            href: /de/index.html
          - text: Français
            href: /fr/index.html
  announcement:
    icon: info-circle
    dismissable: true
    content: Diese Seite beinhaltet einen *Working Draft* und kann sich dadurch laufend verändern. Für eine aktuelle Version, besuchen Sie [ech.ch](https://ech.ch/).
    type: warning

bibliography: references.yaml
csl: assets/din-1505-2-alphanumeric.csl

# eCH metadata shared by all languages, translated by the Lua filter
metadata-files:
  - _ech.yml
filters:
  - assets/ech-metadata.lua
  - quarto
  - assets/ech-captions.lua
shortcodes:
  - assets/ech-shortcodes.lua

format:
  html:
    theme:
      light: [cosmo, assets/ech.scss]
      dark: [cosmo, assets/ech.scss, assets/ech-dark.scss]
    template-partials:
      - assets/title-metadata.html
    toc: true
    toc-depth: 2
    highlight-style: github   # muted colours in both the light and the dark theme
    code-line-numbers: true
    tbl-colwidths: true       # keep the column widths of the generated grid tables
    # "Other formats" under the table of contents. The plain `html` entry
    # adds no link but stops Quarto from appending its default entries.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-earmark-pdf
      - format: gfm
        text: Markdown
        icon: markdown
    number-sections: true

    syntax-definitions:
     - assets/sparql.xml
     - assets/turtle.xml
  gfm: 
    toc: true
    toc-depth: 2
    number-sections: true
  docx:
    toc: true
    toc-depth: 2
    number-sections: true
    reference-doc: https://ech.ch/sites/default/files/imce/eCH-Dossier/0001-0030/eCH-0003/11.1.0/Beilagen/Beilagen%20aktuell%2028.11.2025/XXXX_d_DRA_JJJJ-MM-TT_eCH-0XXX_Vx.x.x_Titel.docx
    link-citations: true
  typst:
    papersize: a4
    mainfont: Nimbus Sans
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: true
    section-numbering: 1.1.1
    template-partials:
      - assets/typst-template.typ
      - assets/typst-show.typ
    code-line-numbers: true
    syntax-definitions:
     - assets/sparql.xml
     - assets/turtle.xml
    citeproc: true
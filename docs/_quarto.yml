project:
  output-dir: ../build/docs/
  type: website

# The pages to render (one folder per language), the website title, the
# repository links, the language menu and the announcement banner come from
# ../project.yml (see metadata-files below).
website:
  favicon: _extensions/ech/favicon.svg
  navbar:
    background: dark
    title: false
    logo: _extensions/ech/ech.svg
    logo-alt: eCH

# Code chunks show only their output; use `#| echo: true` to show the code.
execute:
  echo: false

bibliography: references.yaml

# Generated from ../project.yml by `make docs`: the eCH metadata shared by all
# languages (translated by the Lua filter), the pages to render and the
# website settings.
metadata-files:
  - _project.yml

# The eCH layout comes from the Quarto extension in _extensions/ech/: Lua
# filters, shortcodes, the Typst template, styles and the citation style.
# Keep ech-typst last: rendered earlier, its downloaded images are removed
# again before the PDF is compiled.
format:
  ech-html:
    format-links:
      - html
      - text: PDF
        href: index.pdf
        icon: file-earmark-pdf
      - text: Markdown
        href: index.md
        icon: markdown
  ech-gfm: default
  ech-docx: default
  ech-typst: default
